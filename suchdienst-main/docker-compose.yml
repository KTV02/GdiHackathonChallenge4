services:
  elasticsearch:
    image: elasticsearch:9.4.4
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ingest.geoip.downloader.enabled=false
    ulimits:
      nproc: 4096
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 8G
    volumes:
      - ./src/test/resources/decompounder/word_list_de.txt:/usr/share/elasticsearch/config/decompounder/word_list_de.txt
      - ./src/test/resources/decompounder/hyphenation_patterns_de.xml:/usr/share/elasticsearch/config/decompounder/hyphenation_patterns_de.xml

  kibana:
    image: kibana:9.4.4
    profiles:
      - development
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  elasticsearch_exporter:
    restart: unless-stopped
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.2.1
    profiles:
      - development
    command:
      - "--es.uri=http://elasticsearch:9200"
    ports:
      - "127.0.0.1:9114:9114"

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.21.0
    profiles:
      - development
    ports:
      - 9000:9090
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command: --web.enable-lifecycle  --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    profiles:
      - development
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - 4000:3000

  redisinsight:
    image: redislabs/redisinsight:latest
    profiles:
      - development
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - redis
    volumes:
      - redisinsight_data:/data

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning
    volumes:
      - cache:/data

volumes:
  prometheus-data:
  grafana_data:
  cache:
  redisinsight_data:
