description:
  de:
    genericName: "Suchdienst API"
    shortDescription: >
      REST-API des Suchdienstes im Portalverbund Online-Gateway (PVOG) für die anwendergerechte Suche nach Verwaltungsleistungen.

    longDescription: >
      Der Suchdienst ist Bestandteil des Portalverbund-Onlinegateway-Projekts und macht Verwaltungsleistungen für externe Nutzer suchbar und auffindbar. Die Suchdienst-API ist eine auf Spring Boot basierende Webanwendung, die die Anwendungslogik bereitstellt und als REST-Schnittstelle genutzt werden kann. Portalverbundsteilnehmer können die API anbinden, um die zentrale Suchfunktion des Portalverbunds zu integrieren. Zur dauerhaften Speicherung und Indizierung aller durchsuchbaren Geschäftsobjekte kommt Elasticsearch zum Einsatz.

    features:
      - "REST-API für Verwaltungsleistungen, Orte, Organisationen und weitere Geschäftsobjekte"
      - "Unterstützung von xZuFi 2.2.0 und 2.3.1 als Datenformat"
      - "Abruf der Quelldaten in ihrer ursprünglichen Form (XZuFi als Json) über dedizierte Daten-Endpunkte"
      - "Endpunkte mit aggregierten Modellen für suchoptimierte Ausgaben"
      - "Elasticsearch-basierte Datenhaltung und Indizierung"
      - "Konfigurierbar über Admin-APIs (Regionalschlüssel, PLZ, Codelisten, Lebenslagen)"
      - "Redis-Caching und Keycloak-Authentifizierung"
      - "OpenAPI-konforme API-Beschreibung"
      - "Clusterfähig für hohe Skalierbarkeit und parallele Anfragen"
      - "EFK-kompatibles Logging"
  en:
    genericName: "Search Service API"
    shortDescription: >
      REST API of the Search Service in the Portalverbund Online-Gateway (PVOG) for user-friendly search of administrative services.

    longDescription: >
      The Search Service is part of the Portalverbund Online-Gateway project and makes administrative services searchable and findable for external users. The Search Service API is a Spring Boot-based web application that provides the application logic and can be used as a REST interface. Portal network participants can connect the API to integrate the central search function of the portal network. Elasticsearch is used for permanent storage and indexing of all searchable business objects.

    features:
      - "REST API for administrative services, locations, organizations, and other business objects"
      - "Support for xZuFi 2.2.0 and 2.3.1 as data format"
      - "Retrieval of source data in its original form (XZuFi as JSON) via dedicated data endpoints"
      - "Endpoints with aggregated models for search-optimized outputs"
      - "Elasticsearch-based data storage and indexing"
      - "Configurable via admin APIs (regional keys, postal codes, code lists, life situations)"
      - "Redis caching and Keycloak authentication"
      - "OpenAPI-compliant API description"
      - "Cluster-capable for high scalability and parallel requests"
      - "EFK-compatible logging"
