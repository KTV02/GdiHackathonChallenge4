spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd
    default-property-inclusion: NON_NULL
    mapper:
      DEFAULT_VIEW_INCLUSION: true
  elasticsearch:
    uris: localhost:9200
  cache:
    type: NONE

de:
  dataport:
    suchdienst:
      bkg:
        gdz-geokodierung-basis-url: https://sg.geodatenzentrum.de/gdz_geokodierung_bund__{kennung}
        password: bkg-secret
        flat-key-resolution-timeout: PT10S
      importer:
        delay-between-queue-polls: PT0.100S
        delay-between-verwaltungsleistung-import-attempts: PT0.100S
      in-mem-cache:
        codelistEntries: maximumSize=200,recordStats
        codelistDownload: maximumSize=10,expireAfterWrite=5m,recordStats
        personalMatters: maximumSize=200,expireAfterWrite=5m,recordStats
    pv_onlinegw.pv.virusscan.antivirusscanner.name: DoNothingAntivirusScanner
    pv_onlinegw.pv.virusscan.icap.IcapAntivirusScanner.host: 10.61.127.77
    pv_onlinegw.pv.virusscan.icap.IcapAntivirusScanner.port: 1344
    pv_onlinegw.pv.virusscan.icap.IcapAntivirusScanner.icapServiceName: avscan

keycloak:
  auth-server-url: https://private.devintern.pvog.dataport.de/auth
  realm: pvog
  resource: suchdienst
  credentials:
    secret: f6649252-d475-4eaa-dc77-d7d8e3f9f4ff
  bearer-only: true
  principal-attribute: preferred_username

springdoc:
  show-actuator: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  swagger-ui:
    displayRequestDuration: true

cors:
  custom:
    config:
      cors:
        allowed-origins: http://localhost:4200,https://localhost:4200,http://localhost:3000
        allowed-headers: "*"
        allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
        allow-credentials: true
        max-age: 3600
      enabled: true
    displayRequestDuration: true
